<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Proyectos Finales - Web II</title>
    <style>
        :root {
            --primary: #512bd4; /* .NET Color */
            --accent: #2563eb;
            --dark: #0f172a;
            --light: #f8fafc;
            --border: #e2e8f0;
            --text: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--light);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 { color: var(--dark); font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: var(--accent); font-weight: 600; font-size: 1.1rem; }

        /* Estilo del Acordeón */
        .accordion-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .accordion-header {
            padding: 20px;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }

        .accordion-header:hover { background: #f1f5f9; }

        .accordion-header h3 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .project-number {
            background: var(--primary);
            color: white;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .icon {
            transition: transform 0.3s;
            font-weight: bold;
            color: var(--primary);
        }

        /* Contenido del Acordeón */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: #fff;
        }

        .content-inner {
            padding: 0 25px 25px 25px;
            border-top: 1px solid var(--border);
        }

        .content-inner h4 {
            color: var(--accent);
            margin-top: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            border-bottom: 1px dotted #e2e8f0;
        }

        li::before { content: "✔"; color: var(--success, #22c55e); font-weight: bold; }

        /* Clase activa */
        .active .accordion-content { max-height: 1200px; }
        .active .icon { transform: rotate(180deg); }
        .active .accordion-header { background: #f8fafc; border-bottom: 1px solid var(--border); }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Propuestas de Proyecto Final</h1>
        <div class="subtitle">Desarrollo de Aplicaciones Web II - Nivel Grado</div>
        <p>Selecciona una opción para desplegar los requerimientos funcionales (RF) técnicos.</p>
    </header>

    <div id="project-list">
        </div>
</div>

<script>
    const proyectos = [
        {
            titulo: "Asistente de Tutoría Inteligente (IA)",
            rf: [
                "Autenticación mediante ASP.NET Identity con roles Docente/Estudiante.",
                "Carga de base de conocimientos mediante editor de texto enriquecido.",
                "Interfaz de chat asíncrona usando Fetch API.",
                "Integración con Gemini API para respuestas contextuales.",
                "Historial de conversaciones guardado por usuario.",
                "Dashboard de analíticas con los temas más consultados.",
                "Opción de marcar respuestas como 'útiles' para feedback del modelo.",
                "Buscador de tutoriales cargados previamente por el docente.",
                "Sistema de notificaciones para nuevas guías de estudio.",
                "Exportación de chats a formato PDF."
            ]
        },
        {
            titulo: "Gestión de Prácticas y Pasantías",
            rf: [
                "Registro de perfiles de empresas y estudiantes.",
                "Publicación de vacantes de pasantías con filtros de carrera.",
                "Carga de currículum vitae en formato PDF.",
                "Sistema de postulación a vacantes con un solo clic.",
                "Flujo de aprobación: Estudiante -> Tutor Académico -> Empresa.",
                "Panel de seguimiento de horas de pasantía completadas.",
                "Generación automática de convenios en formato digital.",
                "Chat interno entre el pasante y el supervisor de la empresa.",
                "Módulo de evaluación final del desempeño del pasante.",
                "Reportes estadísticos de inserción laboral para la facultad."
            ]
        },
        {
            titulo: "Marketplace de Recursos Digitales",
            rf: [
                "Catálogo de recursos (libros, guías, exámenes) por materia.",
                "Carga de archivos con validación de tipo y tamaño.",
                "Sistema de búsqueda avanzada por etiquetas y niveles.",
                "Carrito de descarga/compra de recursos.",
                "Integración de pasarela de pago (simulada) o sistema de créditos.",
                "Módulo de reseñas y valoraciones por estrellas.",
                "Perfil de contribuidor con ranking de popularidad.",
                "Previsualización de documentos (Thumbnail) antes de descargar.",
                "Gestión de categorías y subcategorías dinámica.",
                "Notificaciones de nuevos recursos en materias suscritas."
            ]
        },
        {
            titulo: "Simulador de Exámenes y Banco de Preguntas",
            rf: [
                "Creación de bancos de preguntas multiformato (opción múltiple, V/F).",
                "Generación de exámenes aleatorios basados en dificultad.",
                "Temporizador de examen con guardado automático de progreso.",
                "Calificación instantánea tras finalizar el intento.",
                "Revisión de errores con explicaciones cargadas por el docente.",
                "Límite de intentos configurado por el profesor.",
                "Gráficas de rendimiento histórico del estudiante.",
                "Importación masiva de preguntas desde archivos Excel/JSON.",
                "Bloqueo de navegación (detección de pérdida de foco en pestaña).",
                "Certificado de aprobación generado en PDF automáticamente."
            ]
        },
        {
            titulo: "Sistema de Préstamo de Equipos de Lab.",
            rf: [
                "Inventario detallado con códigos QR/Barras únicos.",
                "Reserva de equipos mediante calendario interactivo.",
                "Validación de disponibilidad en tiempo real.",
                "Sistema de alertas por correo para devoluciones tardías.",
                "Gestión de kits de equipos (ej: kit de cámara + trípode).",
                "Registro de daños o incidencias al momento de la entrega.",
                "Dashboard de administrador para control de stock.",
                "Historial de préstamos por estudiante y por equipo.",
                "Módulo de penalizaciones y bloqueos automáticos.",
                "Reporte de equipos más solicitados y mantenimiento preventivo."
            ]
        },
        {
            titulo: "Red Social Académica de Apuntes",
            rf: [
                "Creación de grupos por asignatura y sección.",
                "Muro de publicaciones para compartir apuntes y dudas.",
                "Sistema de 'Me gusta' y 'Guardar para después'.",
                "Módulo de preguntas y respuestas tipo StackOverflow.",
                "Ranking de mejores estudiantes colaboradores del mes.",
                "Chat privado entre estudiantes para estudio grupal.",
                "Integración con calendarios (Google/Outlook) para exámenes.",
                "Filtro de contenido ofensivo o inapropiado.",
                "Buscador global de temas específicos dentro de los apuntes.",
                "Perfil de usuario con logros y medallas académicas."
            ]
        },
        {
            titulo: "Sistema de Votación Estudiantil",
            rf: [
                "Padrón electoral cargado desde base de datos académica.",
                "Autenticación de doble factor (2FA) para votar.",
                "Creación de boletas electorales con fotos de candidatos.",
                "Voto secreto encriptado en la base de datos.",
                "Resultados en tiempo real mediante gráficas de barras.",
                "Control de votación única por número de matrícula.",
                "Módulo de auditoría para verificar integridad de la urna digital.",
                "Configuración de fechas y horas exactas de apertura/cierre.",
                "Generación de acta de resultados final firmada digitalmente.",
                "Portal de noticias y propuestas de los candidatos."
            ]
        },
        {
            titulo: "Gestor de Tesis y Proyectos de Grado",
            rf: [
                "Registro de anteproyectos con asignación de asesores.",
                "Bitácora de reuniones (minutas) con firma de aceptación.",
                "Carga de avances por capítulos con control de versiones.",
                "Espacio de retroalimentación directa (comentarios sobre el texto).",
                "Cronograma de entregas con hitos (Milestones).",
                "Validación de formato de normas APA (automatizada básica).",
                "Sistema de gestión de jurados para la defensa final.",
                "Notificaciones de fechas críticas y defensas públicas.",
                "Repositores de tesis aprobadas para consulta.",
                "Generación de reportes de progreso para la dirección de carrera."
            ]
        },
        {
            titulo: "Localizador de Espacios de Estudio",
            rf: [
                "Mapa interactivo de la biblioteca/facultad (SVG).",
                "Reserva de cubículos de estudio individual o grupal.",
                "Check-in mediante código QR en la mesa física.",
                "Indicador visual de ocupación (Verde/Rojo) en tiempo real.",
                "Límite de tiempo de ocupación con aviso de finalización.",
                "Buscador de salas por capacidad y equipamiento (Pizarra, TV).",
                "Reporte de uso de espacios para optimización de planta física.",
                "Módulo de 'Reportar ruido' o problemas en la sala.",
                "Integración con sensores (simulados) para detección de presencia.",
                "Sistema de espera: aviso al móvil cuando se libera una sala."
            ]
        },
        {
            titulo: "Monitor de Egresados y Empleabilidad",
            rf: [
                "Encuesta automatizada de seguimiento laboral para egresados.",
                "Módulo de carga de trayectoria profesional (LinkedIn Style).",
                "Dashboard estadístico de sueldos promedio por área.",
                "Mapa de calor con la ubicación geográfica de los egresados.",
                "Bolsa de empleo exclusiva para graduados de la facultad.",
                "Foro de networking para mentoría entre egresados y alumnos.",
                "Generación de informes para acreditaciones de carrera.",
                "Sistema de invitación a eventos de actualización profesional.",
                "Validación de títulos mediante código de verificación público.",
                "Gestión de donaciones o aportes a proyectos de la facultad."
            ]
        }
    ];

    const projectList = document.getElementById('project-list');

    proyectos.forEach((p, index) => {
        const item = document.createElement('div');
        item.className = 'accordion-item';
        
        item.innerHTML = `
            <div class="accordion-header" onclick="toggleAccordion(this)">
                <h3><span class="project-number">${index + 1}</span> ${p.titulo}</h3>
                <span class="icon">▼</span>
            </div>
            <div class="accordion-content">
                <div class="content-inner">
                    <h4>Requerimientos Funcionales (RF)</h4>
                    <ul>
                        ${p.rf.map(req => `<li>${req}</li>`).join('')}
                    </ul>
                </div>
            </div>
        `;
        projectList.appendChild(item);
    });

    function toggleAccordion(header) {
        const item = header.parentElement;
        const isOpen = item.classList.contains('active');
        
        // Cerrar todos los demás
        document.querySelectorAll('.accordion-item').forEach(i => i.classList.remove('active'));
        
        // Abrir el actual si estaba cerrado
        if (!isOpen) {
            item.classList.add('active');
        }
    }
</script>

</body>
</html>
